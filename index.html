<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101116"><link rel="manifest" href="manifest.webmanifest"><title>Prompt Studio</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f6f6fa;background:#101116}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:#292b35;color:white}button.primary{background:#6858ff}button.danger{color:#ff9b9b}input,textarea,select{background:#20212a;color:white;border:1px solid #3a3b49;border-radius:10px;padding:12px;width:100%}textarea{min-height:110px;resize:vertical}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px;flex-wrap:wrap;border-bottom:1px solid #292b35}main{max-width:1000px;margin:auto;padding:20px}h1{font-size:24px;margin:0}h2{font-size:20px}.muted{color:#a9aabb}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.card{background:#1b1c25;border:1px solid #30313d;border-radius:16px;padding:18px;margin:14px 0}.grow{flex:1}.hidden{display:none!important}.blocks{display:grid;gap:12px}.tag{font-size:12px;text-transform:uppercase;font-weight:800;letter-spacing:.1em}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.pill{border-radius:30px}.stage{position:fixed;inset:0;background:#08090d;z-index:10;display:flex;flex-direction:column}.stagebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;background:#171820;z-index:2}.stageview{position:relative;overflow:auto;flex:1}.script{max-width:1000px;margin:0 auto;padding:40vh 7vw 55vh;line-height:1.5;font-size:var(--font-size,42px);font-weight:650;white-space:pre-wrap}.script p{margin:0 0 1.5em}.ideas{display:grid;gap:18px;max-width:950px;margin:auto;padding:8vh 20px}.idea{border:2px solid;border-radius:18px;padding:20px;background:#171820}.idea h2{font-size:clamp(22px,5vw,42px)}.idea li{font-size:clamp(20px,3vw,30px);margin:12px 0}.centerline{position:absolute;top:42%;left:0;right:0;border-top:1px dashed #ffffff44;pointer-events:none}.compact{width:110px!important}input[type=range]{width:130px;padding:0;accent-color:#6858ff}@media(max-width:600px){.fields{grid-template-columns:1fr}.compact{width:75px!important}.stagebar{font-size:13px}.stagebar button{padding:9px}.script{font-size:var(--font-size,36px)}}
body.immersive .stagebar{display:none}body.immersive .stageview{height:100dvh}body.immersive .stage{height:100dvh}body.immersive .stageview:after{content:"";position:fixed;bottom:0;left:0;right:0;height:12px;pointer-events:none}#immersiveExit{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;opacity:.16;padding:8px 11px;background:#454653}#immersiveExit:focus,#immersiveExit:active{opacity:1}body:not(.immersive) #immersiveExit{display:none}
/* Respect display cutouts and rounded corners on mobile landscape. */
.stageview{min-width:0;max-width:100%;overscroll-behavior:contain}
.script{width:100%;max-width:1000px;padding-left:max(7vw,calc(env(safe-area-inset-left,0px) + 22px));padding-right:max(7vw,calc(env(safe-area-inset-right,0px) + 22px));overflow-wrap:anywhere}
.ideas{width:100%;padding-left:max(20px,calc(env(safe-area-inset-left,0px) + 22px));padding-right:max(20px,calc(env(safe-area-inset-right,0px) + 22px));min-width:0}
.idea{min-width:0;overflow-wrap:anywhere}
.stagebar{padding-left:max(12px,calc(env(safe-area-inset-left,0px) + 12px));padding-right:max(12px,calc(env(safe-area-inset-right,0px) + 12px))}
#immersiveExit{right:calc(env(safe-area-inset-right,0px) + 12px)}
@media(orientation:landscape) and (max-height:600px){.script{padding-left:max(7vw,calc(env(safe-area-inset-left,0px) + 30px));padding-right:max(7vw,calc(env(safe-area-inset-right,0px) + 30px))}.ideas{padding-left:max(24px,calc(env(safe-area-inset-left,0px) + 30px));padding-right:max(24px,calc(env(safe-area-inset-right,0px) + 30px))}}
</style></head><body><header><h1>✦ Prompt Studio</h1><div class="row"><button id="homeBtn">Mis proyectos</button><button id="editorBtn">Editor</button><button class="primary" id="playBtn">▶ Reproducir</button></div></header><main><section id="home"><div class="row"><h2 class="grow">Mis proyectos</h2><button class="primary" id="newBtn">+ Nuevo proyecto</button><button id="importBtn">Importar JSON</button><input id="fileInput" type="file" accept=".json,application/json" hidden></div><div id="projects"></div></section><section id="linkPreview" class="hidden"><div class="card"><h2>Guion recibido desde un enlace</h2><p class="muted" id="previewInfo"></p><p>Comprueba el título y el número de bloques antes de guardarlo en este dispositivo.</p><div class="row"><button class="primary" id="acceptLink">Guardar y editar</button><button id="acceptPlay">Guardar y reproducir</button><button id="cancelLink">Cancelar</button></div></div></section><section id="editor" class="hidden"><div class="row"><h2 class="grow">Editor de guion</h2><button id="exportBtn">Exportar JSON</button><button id="shareBtn">🔗 Compartir enlace</button><button class="primary" id="addBtn">+ Añadir bloque</button></div><div class="card field"><label for="projectName">Nombre del proyecto</label><input id="projectName" placeholder="Mi vídeo"></div><p class="muted">Cada bloque tiene texto para teleprompter e ideas clave para escaleta. Se guarda automáticamente en este dispositivo.</p><div id="blocks" class="blocks"></div></section></main><section id="stage" class="stage hidden"><div class="stagebar"><button id="exitBtn">✕ Salir</button><select id="mode" class="compact"><option value="prompt">Teleprompter</option><option value="outline">Escaleta</option></select><button id="toggleBtn" class="primary">▶ Iniciar</button><button id="prevBtn">←</button><button id="nextBtn">→</button><label>Velocidad <input type="range" id="speed" min="5" max="120" value="35"></label><label>Letra <input type="range" id="fontSize" min="24" max="90" value="42"></label><button id="fullBtn">⛶</button></div><button id="immersiveExit" aria-label="Mostrar controles">☰</button><div class="stageview" id="stageview"><div class="centerline" id="centerline"></div><div id="script" class="script"></div><div id="ideas" class="ideas hidden"></div></div></section><script>
const TYPES=[['Hook','#ff5b63'],['Introducción','#63a7ff'],['Desarrollo','#f5f5f7'],['Ejemplo','#ffc66b'],['Cierre','#6ce3a3'],['CTA','#c998ff']];
const $=id=>document.getElementById(id);const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
let projects=[],current=null,playing=false,offset=0,idx=0,last=0,frame=0,pendingLink=null;
try{projects=JSON.parse(localStorage.getItem('promptStudioProjects')||'[]')}catch(e){projects=[]}
const save=()=>localStorage.setItem('promptStudioProjects',JSON.stringify(projects));
const active=()=>projects.find(p=>p.id===current);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(page){$('home').classList.toggle('hidden',page!=='home');$('editor').classList.toggle('hidden',page!=='editor');$('stage').classList.toggle('hidden',page!=='stage');$('linkPreview').classList.toggle('hidden',page!=='preview');}
function renderHome(){ $('projects').innerHTML=projects.length?projects.map(p=>'<div class="card row"><div class="grow"><strong>'+esc(p.name)+'</strong><div class="muted">'+p.blocks.length+' bloques</div></div><button data-open="'+p.id+'">Abrir</button><button data-duplicate="'+p.id+'">Duplicar</button><button class="danger" data-delete="'+p.id+'">Eliminar</button></div>').join(''):'<div class="card muted">Aún no hay proyectos. Crea el primero para empezar.</div>'; }
function openProject(id){current=id;renderEditor();show('editor')}
function renderEditor(){let p=active();if(!p)return;$('projectName').value=p.name;$('blocks').innerHTML=p.blocks.map((b,i)=>'<article class="card" data-block="'+b.id+'"><div class="row"><span class="tag grow" style="color:'+esc(b.color)+'">Bloque '+(i+1)+'</span><button data-up="'+b.id+'">↑</button><button data-down="'+b.id+'">↓</button><button class="danger" data-remove="'+b.id+'">Eliminar</button></div><div class="fields"><label class="field">Sección<select data-field="type">'+TYPES.map(t=>'<option '+(b.type===t[0]?'selected':'')+'>'+t[0]+'</option>').join('')+'<option '+(!TYPES.some(t=>t[0]===b.type)?'selected':'')+'>Personalizado</option></select></label><label class="field">Color<input type="color" data-field="color" value="'+esc(b.color)+'"></label><label class="field full">Texto del teleprompter<textarea data-field="text" placeholder="Escribe aquí el guion...">'+esc(b.text)+'</textarea></label><label class="field full">Ideas para escaleta (una por línea)<textarea data-field="ideas" placeholder="Concepto 1&#10;Concepto 2&#10;Concepto 3">'+esc(b.ideas)+'</textarea></label></div></article>').join('')}
function addBlock(){let p=active();if(!p)return;p.blocks.push({id:uid(),type:'Desarrollo',color:'#f5f5f7',text:'',ideas:''});save();renderEditor()}
$('newBtn').onclick=()=>{let p={id:uid(),name:'Nuevo vídeo',blocks:[{id:uid(),type:'Hook',color:'#ff5b63',text:'Escribe aquí tu hook.',ideas:'Idea principal\nPregunta de apertura'},{id:uid(),type:'Desarrollo',color:'#f5f5f7',text:'Desarrolla aquí el contenido.',ideas:'Punto 1\nPunto 2\nPunto 3'}]};projects.unshift(p);save();openProject(p.id)};
$('homeBtn').onclick=()=>{show('home');renderHome()};$('editorBtn').onclick=()=>{if(active()){renderEditor();show('editor')}};$('addBtn').onclick=addBlock;
$('projectName').oninput=e=>{active().name=e.target.value;save()};
$('projects').onclick=e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.open)openProject(d.open);if(d.duplicate){let p=projects.find(x=>x.id===d.duplicate);projects.unshift({...JSON.parse(JSON.stringify(p)),id:uid(),name:p.name+' (copia)',blocks:p.blocks.map(b=>({...b,id:uid()}))});save();renderHome()}if(d.delete&&confirm('¿Eliminar este proyecto?')){projects=projects.filter(p=>p.id!==d.delete);if(current===d.delete)current=null;save();renderHome()}};
$('blocks').oninput=e=>{let el=e.target.closest('[data-block]'),b=active().blocks.find(x=>x.id===el?.dataset.block);if(!b||!e.target.dataset.field)return;b[e.target.dataset.field]=e.target.value;if(e.target.dataset.field==='type'&&b.type!=='Personalizado'){b.color=TYPES.find(t=>t[0]===b.type)?.[1]||b.color;renderEditor()}save()};
$('blocks').onclick=e=>{let d=e.target.dataset,p=active();if(!p)return;let id=d.remove||d.up||d.down;if(!id)return;let i=p.blocks.findIndex(b=>b.id===id);if(d.remove)p.blocks.splice(i,1);else{let j=i+(d.up?-1:1);if(j>=0&&j<p.blocks.length)[p.blocks[i],p.blocks[j]]=[p.blocks[j],p.blocks[i]]}save();renderEditor()};
$('exportBtn').onclick=()=>{let p=active();if(!p)return;let blob=new Blob([JSON.stringify(p,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(p.name.replace(/[^a-z0-9-_]/gi,'-')||'guion')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let p=JSON.parse(await f.text());if(!Array.isArray(p.blocks))throw Error('Formato inválido');p={id:uid(),name:String(p.name||'Guion importado'),blocks:p.blocks.map(b=>({id:uid(),type:String(b.type||'Desarrollo'),color:/^#[0-9a-f]{6}$/i.test(b.color)?b.color:'#f5f5f7',text:String(b.text||''),ideas:String(b.ideas||'')}))};projects.unshift(p);save();openProject(p.id)}catch(err){alert('No se pudo importar: '+err.message)}e.target.value=''};
function renderStage(){let p=active();if(!p)return;$('script').innerHTML=p.blocks.map(b=>'<p style="color:'+esc(b.color)+'">'+esc(b.text||' ')+'</p>').join('');$('ideas').innerHTML=p.blocks.slice(idx,idx+3).map(b=>'<div class="idea" style="border-color:'+esc(b.color)+'"><div class="tag" style="color:'+esc(b.color)+'">'+esc(b.type)+'</div><h2>'+esc(b.text.split(/[.!?\n]/)[0].slice(0,90)||b.type)+'</h2><ul>'+b.ideas.split('\n').filter(Boolean).map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul></div>').join('');let outline=$('mode').value==='outline';$('script').classList.toggle('hidden',outline);$('ideas').classList.toggle('hidden',!outline);$('centerline').classList.toggle('hidden',outline);$('script').style.setProperty('--font-size',$('fontSize').value+'px');}
function pause(){playing=false;$('toggleBtn').textContent='▶ Iniciar';cancelAnimationFrame(frame)}
function tick(t){if(!playing)return;if(last)offset+=(t-last)*Number($('speed').value)/1000;last=t;$('stageview').scrollTop=offset;frame=requestAnimationFrame(tick)}
function start(){if(playing)return;playing=true;last=0;$('toggleBtn').textContent='Ⅱ Pausar';if($('mode').value==='prompt')frame=requestAnimationFrame(tick)}
$('playBtn').onclick=()=>{if(!active()){if(!projects.length){$('newBtn').click()}else current=projects[0].id}pause();offset=0;idx=0;$('mode').value='prompt';renderStage();show('stage');$('stageview').scrollTop=0};
$('exitBtn').onclick=()=>{pause();setImmersive(false);if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});show('editor')};$('toggleBtn').onclick=()=>playing?pause():start();
$('mode').onchange=()=>{pause();offset=0;$('stageview').scrollTop=0;renderStage()};
$('speed').oninput=()=>{};$('fontSize').oninput=renderStage;
$('nextBtn').onclick=()=>{if($('mode').value==='outline'){idx=Math.min(idx+1,Math.max(0,active().blocks.length-1));renderStage()}else{offset=Math.min(offset+250,$('stageview').scrollHeight);$('stageview').scrollTop=offset}};
$('prevBtn').onclick=()=>{if($('mode').value==='outline'){idx=Math.max(0,idx-1);renderStage()}else{offset=Math.max(0,offset-250);$('stageview').scrollTop=offset}};
$('stageview').onscroll=()=>{if(!playing&&$('mode').value==='prompt')offset=$('stageview').scrollTop};
function setImmersive(on){document.body.classList.toggle('immersive',on);$('fullBtn').textContent=on?'⛶ Salir':'⛶';}
$('fullBtn').onclick=async()=>{if(document.body.classList.contains('immersive')){setImmersive(false);if(document.fullscreenElement)try{await document.exitFullscreen()}catch(e){};return}setImmersive(true);try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch(e){}};
$('immersiveExit').onclick=()=>{setImmersive(false);if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('immersive'))setImmersive(false)});
document.addEventListener('keydown',e=>{if($('stage').classList.contains('hidden'))return;if(e.code==='Space'){e.preventDefault();$('toggleBtn').click()}if(e.code==='ArrowRight')$('nextBtn').click();if(e.code==='ArrowLeft')$('prevBtn').click()});

/* Share format: #import= followed by base64url(UTF-8 JSON). No server required. */
function encodeLink(obj){let bytes=new TextEncoder().encode(JSON.stringify(obj)),binary='';for(let i=0;i<bytes.length;i++)binary+=String.fromCharCode(bytes[i]);return btoa(binary).split('+').join('-').split('/').join('_').replace(/=+$/,'')}
function decodeLink(value){if(value.length>100000)throw Error('El enlace es demasiado largo');let base=value.replace(/-/g,'+').replace(/_/g,'/');base+='='.repeat((4-base.length%4)%4);let raw=atob(base),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(bytes))}
function normalizeProject(obj){if(!obj||typeof obj!=='object'||!Array.isArray(obj.blocks)||obj.blocks.length>100)throw Error('Formato de guion no válido');return {id:uid(),name:String(obj.name||'Guion de ChatGPT').slice(0,140),blocks:obj.blocks.map(b=>({id:uid(),type:String(b.type||'Desarrollo').slice(0,40),color:/^#[0-9a-f]{6}$/i.test(b.color)?b.color:'#f5f5f7',text:String(b.text||'').slice(0,30000),ideas:String(b.ideas||'').slice(0,12000)}))}}
function readIncomingLink(){let match=location.hash.match(/^#import=([A-Za-z0-9_-]+)$/);if(!match)return;try{pendingLink=normalizeProject(decodeLink(match[1]));$('previewInfo').textContent=pendingLink.name+' · '+pendingLink.blocks.length+' bloques';show('preview')}catch(e){alert('No se pudo abrir el guion del enlace: '+e.message);history.replaceState(null,'',location.pathname+location.search)}}
function clearIncoming(){history.replaceState(null,'',location.pathname+location.search)}
function acceptIncoming(play){if(!pendingLink)return;projects.unshift(pendingLink);current=pendingLink.id;pendingLink=null;save();clearIncoming();if(play){$('playBtn').click()}else openProject(current)}
$('acceptLink').onclick=()=>acceptIncoming(false);$('acceptPlay').onclick=()=>acceptIncoming(true);
$('cancelLink').onclick=()=>{pendingLink=null;clearIncoming();renderHome();show('home')};
$('shareBtn').onclick=async()=>{let p=active();if(!p)return;let payload={name:p.name,blocks:p.blocks.map(({type,color,text,ideas})=>({type,color,text,ideas}))};let link=location.origin+location.pathname+'#import='+encodeLink(payload);if(link.length>7500){alert('El guion es demasiado largo para compartirlo de forma fiable mediante enlace. Utiliza Exportar JSON.');return}try{await navigator.clipboard.writeText(link);alert('Enlace copiado. Ábrelo en otro dispositivo para importar el proyecto.')}catch(e){prompt('Copia el enlace:',link)}};
window.addEventListener('hashchange',readIncomingLink);

if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
renderHome();readIncomingLink();
</script></body></html>
